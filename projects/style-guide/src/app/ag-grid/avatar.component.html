<table (click)="onClick($event)" class="flex-group flex-start bg-transparent">
    <tr>
        <td>
            <div class="avatar cursor-pointer" style="width:1.75rem; height:1.75rem; margin-top:.15rem">
                <div>
                <img onerror="this.style.display='none'" src="./assets/images/samples/obi-wan.png" />
                </div>
            </div>
        </td>
        <td class="padding-left-0-5">
            <a href="#">{{link}}</a>
        </td>
    </tr>
</table>
