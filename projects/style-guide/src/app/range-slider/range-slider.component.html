<section class="control-bar">
    <h1>Range slider</h1>
</section>

<section class="content-container padding-0">
    <!-- start content repeater -->
    <section class="content-repeater flex-group">
        <section class="flex-1 col-left flex-start">
          <h2>Range slider</h2>
          <div class="describe margin-bottom-1">
            <p>A handy range slider to aid useability</p>
          </div>

          <div class="field">
            <label>Choose range</label>
            <aa-range-slider customClass="max-width-15" [initialValue]="30"></aa-range-slider>
          </div>
        </section>

        <section class="flex-2 col-right flex-start">
          <table class="half-width">
            <caption>Attributes</caption>
            <thead>
              <tr>
                <th>Element</th>
                <th>Attribute</th>
                <th>Type</th>
                <th>Default</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td datalabel="Element">aa-range-slider</td>
                <td datalabel="Attribute">[initialValue]</td>
                <td datalabel="Type">Range</td>
                <td datalabel="Default">30</td>
              </tr>
              <tr>
                <td datalabel="Element">aa-range-slider</td>
                <td datalabel="Attribute">customClass</td>
                <td datalabel="Type">Class</td>
                <td datalabel="Default">Use one of our modifier classes</td>
              </tr>
            </tbody>
          </table>
        </section>

        <!-- mini menu -->
        <nav class="mini-menu flex-group flex-end">
          <button class="custom-icons bg-aa-light-blue-100" (click)="bladeIsOpen(true)">
            <span class="material-icons">visibility</span><span>View gist</span>
          </button>
        </nav>
      </section>

      <aa-blade
        [blockPageUI]="false"
        [toggleBlade]="toggleBlade"
        [suppressAutoClose]="false"
        topPosition="3.5rem"
        [zIndex]="2"
        bladeSize="one-column-width"
        bladeHeading="Gist"
        [enableIcon]="true"
        iconName="table_rows"
        (bladeOpen)="bladeIsOpen($event)"
        >
        <article class="blade-content">
          <a href="https://gist.github.com/angloux/9fe6904748149b01d536d96210d7fe1b" target="_blank">View Gist on GitHub</a>
          <app-gist src="angloux/9fe6904748149b01d536d96210d7fe1b"></app-gist>
        </article>
      </aa-blade>

</section>
