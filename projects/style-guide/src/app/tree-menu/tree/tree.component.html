<ul *ngIf="treeData">
    <li *ngFor="let node of treeData">
        <span class="tree-group flex-group flex-start flex-align-center">
            <span (click)="toggleChild(node)" class="chevron" [ngClass]="{'chevron-down': node.showChildren}" *ngIf="node.children.length !== 0"></span>
            <input type="checkbox" />
            <strong *ngIf="node.children.length !== 0"> {{ node.name }} </strong>
            <a *ngIf="node.children.length === 0" href="{{node.url}}" target="_blank"> {{ node.name }} </a>
            <!-- <button class="material-icons">edit</button> -->
        </span>
        <ul>
            <li>
                <app-tree *ngIf="node.showChildren" [treeData]="node.children"></app-tree>
            </li>
        </ul>
    </li>
</ul>
