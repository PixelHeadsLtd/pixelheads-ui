<section class="control-bar">
    <aa-anchor-back [anchorBackText]="'Style guide'" routerLink=""></aa-anchor-back>
    <h1>Anchor</h1>
</section>

<section class="content-container padding-0">
    
    <section class="content-repeater flex-group">
            
        <section class="flex-1 col-left flex-start">
          <h2>Anchor</h2>
          <div class="describe margin-bottom-1">
            <p>Anchor sits inside the control-bar above the h1.</p>
          </div>
          <div>
            <aa-anchor-back anchorBackText="Previous page title"></aa-anchor-back>
          </div>
        </section>
          
        <section class="flex-2 col-right flex-start">
          <table class="half-width">
            <caption>Attributes</caption>
            <thead>
              <tr>
                <th>Element</th>
                <th>Attribute</th>
                <th>Type</th>
                <th>Default</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td datalabel="Element">aa-anchor-back</td>
                <td datalabel="Attribute">anchorBackText</td>
                <td datalabel="Type">String</td>
                <td datalabel="Default">Previous page title</td>
              </tr>
              <tr>
                <td datalabel="Element">aa-anchor-back</td>
                <td datalabel="Attribute">routerLink</td>
                <td datalabel="Type">Path</td>
                <td datalabel="Default">Your path</td>
              </tr>
            </tbody>
          </table>
        </section>
        
        <!-- mini menu -->
        <nav class="mini-menu flex-group flex-end">
            <button class="custom-icons small bg-aa-light-blue-100" 
              (click)="copyToClipboard(anchorHTML)">
              <span class="material-icons">content_copy</span><span>Copy component</span>
            </button>
            <button class="custom-icons small bg-aa-light-blue-100" (click)="bladeIsOpen($event)">
              <span class="material-icons">visibility</span><span>View gist</span>
            </button>
          </nav>
      </section>
      
      <aa-blade 
        [showModal]="false"
        [toggleBlade]="toggleBlade"
        suppressAutoClose="false"
        topPosition="3.5"
        zIndex="2"
        bladeSize="one-column-width"
        bladeHeading="Gist"
        [enableIcon]="true"
        iconName="table_rows"
        (close)="toggleBlade = false"
        >
        <article class="blade-content">
            <app-gist src="angloux/9e6c8132425e1a4a431014747fbe029b"></app-gist>
            <a href="https://gist.github.com/angloux/9e6c8132425e1a4a431014747fbe029b" target="_blank">View Gist on GitHub</a>
        </article>
      </aa-blade>
    
</section>
