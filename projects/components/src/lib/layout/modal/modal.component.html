<article id="ph-modal" class="ph-modal">
  <div 
    class="ph-modal-container" 
    [ngClass]="{'ph-green' : green, 'ph-orange' : orange, 'ph-red' : red, 'ph-blue' : blue}"
    [ngStyle]="{
      'top' : topPos,
      'right' : rightPos,
      'left' : leftPos,
      'min-width' : minWidth,
      'max-width' : maxWidth,
      'z-index' : zIndex
    }"
  >
    <section *ngIf="!hideHeader" class="ph-modal-header">
      <h2 class="boxed align-center">{{heading}}</h2>
    </section>
    <section class="ph-modal-content">
      {{message}}
      <ng-content select="[content-custom]"></ng-content>
    </section>
    <section class="ph-modal-footer flex-group flex-center">
        <ng-content></ng-content>
    </section>
  </div>
</article>
