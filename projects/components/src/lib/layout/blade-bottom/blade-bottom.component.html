<div 
  class="blade-bottom" 
  [ngClass]="{
    'show' : isOpen, 
    'pinned' : isPinned, 
    'fullscreen' : isFullScreen
  }" 
  [ngStyle]="{
    'top': expandedPosition(), 
    'z-index': zIndex
  }">
  <section class="blade-bottom-header flex-group cursor-pointer {{headerBgColor}}" (click)="toggle()">
      <div class="flex-group flex-start flex-align-center">
        <ng-content select="[custom-header]"></ng-content>
      </div>
      <div class="flex-group flex-end controls {{controlsColor}}">
        <div *ngIf="!disablePinning" (click)="toggleThePin($event)" class="material-icons pin flex-end">push_pin</div>
      </div>
  </section>
  <section class="blade-bottom-content">
    <ng-content select="[custom-content]"></ng-content>
  </section>
</div>
