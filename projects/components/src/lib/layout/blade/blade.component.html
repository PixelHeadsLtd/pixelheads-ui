<!-- MODAL UI BLOCK -->
<div class="aa-blade-modal" *ngIf="toggleBlade && showModal" [ngStyle]="{'z-index' : zIndex}"></div>

<!-- HEADER BAKED IN -->
<aside 
  *ngIf="!customBlade" 
  class="blade animate-all {{bladeSize}}" 
  [ngClass]="{
    'show-blade box-shadow' : toggleBlade,
    'show-tabs' : bladeTabs
  }"
  [ngStyle]="{
    'top' : topPosition + 'rem', 
    'z-index' : zIndex+10
  }"
>
  <article class="blade-header flex-group space-between flex-nowrap">
    <div class="flex-group flex-start flex-align-center">
      <div 
          *ngIf="enablePinning" 
          (click)="toggleThePin($event)"
          [ngClass]="{'pinned' : isPinned}" 
          class="material-icons pin flex-end"
      >
        push_pin
      </div>
      <div *ngIf="enableIcon" class="material-icons header-icon margin-right-0-5">{{iconName}}</div>
      <h2 class="margin-0 ellipsis" [ngStyle]="{'max-width' : headingMaxWidth+'rem' }">
        {{bladeHeading}}
      </h2>
    </div>
    <a class="anchor-close flex-align-center" (click)="onClose()">Close</a>
  </article>
  <ng-content *ngIf="bladeTabs" select="[blade-tabs]"></ng-content>
  <ng-content></ng-content>
</aside>

<!-- CUSTOMISABLE HEADER, CONTENT AND FOOTER -->
<aside 
  *ngIf="customBlade" 
  class="blade animate-all {{bladeSize}}" 
  [ngClass]="{
    'show-blade box-shadow' : toggleBlade,
    'show-tabs custom-header-tabs' : customBladeTabs
  }" 
  [ngStyle]="{
    'top' : topPosition + 'rem', 
    'z-index' : zIndex
  }"
>
  <article class="blade-header custom-header">
    <ng-content select="[custom-header]"></ng-content>
    <ng-content *ngIf="customBladeTabs" select="[custom-blade-tabs]"></ng-content>
  </article>
  <article class="blade-content">
    <ng-content select="[custom-content]"></ng-content>
  </article>
  <article class="blade-footer">
    <ng-content select="[custom-footer]"></ng-content>
  </article>
</aside>
