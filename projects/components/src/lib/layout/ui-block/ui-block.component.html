<article 
    id="ph-ui-block"
    *ngIf="showUiBlock" 
    class="ph-ui-block flex-group flex-center"
    [ngStyle]="{
        'top' : topPos,
        'bottom' : bottomPos
    }"
>
    <h1
        [ngStyle]="{
            'font-size' : fontSize,
            'text-transform' : allCaps&&'uppercase'
        }"
    >
        {{message}}
    </h1>
    <div class="background"></div>
</article>
