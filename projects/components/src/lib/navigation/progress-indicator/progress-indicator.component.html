<li id="aa-progress-indicator" *ngIf="!iconsEnabled" class="{{ progressClass }}">
  <div>{{ progressCount }}</div>
  <a *ngIf="asLink" href="{{ progressLink }}">{{ progressLabel }}</a>
  <span *ngIf="!asLink">{{ progressLabel }}</span>
</li>

<li id="aa-progress-indicator-icons-enabled" *ngIf="iconsEnabled" class="align-center {{ progressClass }}">
  <i class="material-icons padding-x-0-25">{{ iconName }}</i>
  <a *ngIf="asLink" href="{{ progressLink }}">{{ progressLabel }}</a>
  <span *ngIf="!asLink">{{ progressLabel }}</span>
</li>
