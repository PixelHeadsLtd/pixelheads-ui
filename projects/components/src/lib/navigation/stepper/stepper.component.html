<div id="ph-stepper" class="ph-stepper">
    <form formGroup="formName">
        <ul class="ph-stepper-header flex-group">
        <ng-content select="[steps-header]"></ng-content>
        </ul>
        <section class="ph-stepper-content">
            <ng-content select="[steps-content]"></ng-content>
        </section>
        <nav class="ph-stepper-footer">
            <ng-content select="[steps-footer]"></ng-content>
        </nav>
    </form>
</div>
