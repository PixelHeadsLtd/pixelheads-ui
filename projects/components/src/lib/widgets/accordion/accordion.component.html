<article class="accordion-container">
  <h3 class="margin-0">
    <button 
      class="accordion-trigger flex-group space-between flex-align-center {{customBgColor}}" 
      (click)="onOpen($event)" 
      [attr.aria-expanded.true]="showBody"
      [ngClass]="{'expanded' : showBody, 'clean' : accordionClean, 'disabled' : disabled}"
      aria-controls="sectionId" 
      [id]="accordionId" 
      type="button">
        <span class="flex-align-center">
            <span *ngIf="dragable" class="accordion-icon material-icons drag-icon">drag_indicator</span>
            <span *ngIf="iconsEnabled && !fontAwesome" class="accordion-icon material-icons {{iconBgColor}}">{{iconName}}</span>
            <span *ngIf="iconsEnabled && fontAwesome" class="accordion-icon {{fontClassName}}"></span>
            <span class="nested-icons">
              <span class="material-icons" *ngIf="!showBody">add_circle_outline</span>
              <span class="material-icons" *ngIf="showBody">remove_circle_outline</span>
            </span>
            <span class="accordion-heading">{{accordionHeading}}</span>
        </span>
        <div class="flex-group flex-end flex-align-center">
          <ng-content select="[header-custom]"></ng-content>
          <div>
            <div 
              class="toggle-chevrons"
              [class.icon-chevron-down]="!showBody" 
              [class.icon-chevron-up]="showBody"
            >
            </div>
            <div class="toggle-icons flex-align-center">
              <div *ngIf="!showBody" class="material-icons">add</div>
              <div *ngIf="showBody" class="material-icons">remove</div>
            </div>
          </div>
        </div>
    </button>
  </h3>
  <div *ngIf="showBody" [id]="sectionId" class="accordion-panel" [ngClass]="{'clean': accordionClean}">
    <ng-content></ng-content>
  </div>
</article>
