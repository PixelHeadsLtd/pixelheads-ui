<div 
  id="aa-tooltip" 
  (click)="onPopupClick($event)" 
  (mouseover)="onMouseOver()"
  (mouseout)="onMouseOut()" 
  class="flex-group" 
  [ngClass]="{
    'space-between' : includeLabel,
    'flex-start' : includeLegend,
    'show-tooltip-on-hover' : showTooltipOnHover,
    'show-tooltip-on-click' : showTooltipOnClick,
    'tooltip-clicked' : tooltipClicked
  }">
  <label for="{{labelFor}}" *ngIf="includeLabel">{{labelName}}</label>
  <legend class="margin-right-0-5" *ngIf="includeLegend">{{labelName}}</legend>

  <section 
    class="aa-tooltip icon-info" 
    [ngStyle]="{'z-index' : zIndex}"
    [ngClass]="{
      'is-success' : isSuccess,
      'is-info' : isInfo,
      'is-warning' : isWarning,
      'is-error' : isError,
      'custom-icon' : customIcon,
      'hover-stay-open' : toggleTooltip && hasInteracted && hoverStayOpen,
      'popup-closed': isPopupClosed
    }">

    <!-- Default icon but only if hoverStayOpen -->
    <div 
      *ngIf="!customIcon && hoverStayOpen" 
      class="position-absolute top-0 width-1 height-1"
      (click)="togglePopup($event)"
      >
    </div>

    <!-- Default user defined icon -->
    <div
      *ngIf="customIcon && !hoverStayOpen" 
      class="material-icons" 
      [ngClass]="{
        'is-success' : isSuccess,
        'is-info' : isInfo,
        'is-warning' : isWarning,
        'is-error' : isError
      }">
      {{iconName}}
    </div>

    <!-- User defined icon and hoverStayOpen -->
    <div
      *ngIf="customIcon && hoverStayOpen" 
      class="material-icons" 
      (click)="togglePopup($event)"
      [ngClass]="{
        'is-success' : isSuccess,
        'is-info' : isInfo,
        'is-warning' : isWarning,
        'is-error' : isError
      }">
      {{iconName}}
    </div>

    <div class="feature-box box-shadow {{xpos}} {{ypos}}" 
      [ngStyle]="{
        'min-width': setMinWidth,
        'max-width': setMaxWidth
      }">
      <a 
        *ngIf="hoverStayOpen" 
        class="anchor-close" 
        (click)="closePopup($event)">
        Close
      </a>
      <ng-content></ng-content>
    </div>
  </section>
</div>
