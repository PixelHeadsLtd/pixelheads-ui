<section 
    class="ph-ticker-wrapper"
    [ngStyle]="{'width' : tickerWidth}"
>
    <div 
        class="ph-ticker"
        [ngStyle]="{
            '-webkit-animation-duration' : tickerSpeed,
            'animation-duration' : tickerSpeed,
            'padding-left' : tickerWidth
        }"
    >
        <ng-content></ng-content>
    </div>
</section>
