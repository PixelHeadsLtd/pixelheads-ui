<section 
  class="info-panel-stacked"
  [ngStyle]="{
    'width' : wrapperWidth+'rem', 
    'height' : wrapperHeight+'rem'
  }"
  [ngClass]="{
    'approved-forward' : approvedForward,
    'pending-forward' : pendingForward,
    'rejected-forward' : rejectedForward,
    'withdrawn-forward' : withdrawnForward,
    'returned-forward' : returnedForward,
    'abandoned-forward' : abandonedForward,
    'draft-forward' : draftForward,
    'withdrawn-pending-forward' : withdrawalPendingForward,
    'reset-all' : resetAll,
    'full-width' : fullWidth
  }"
>
  <ng-content></ng-content>
</section>
