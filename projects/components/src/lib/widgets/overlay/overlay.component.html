<article 
  class="aa-overlay flex-center" 
  *ngIf="showOverlay" 
  [ngStyle]="{
    'z-index' : zIndex, 
    'top' : topPos,
    'right' : rightPos,
    'bottom' : bottomPos,
    'left' : leftPos
  }">
  <div class="aa-overlay-container">
    <ng-content select="[overlay-header]"></ng-content>
    <ng-content select="[overlay-content]"></ng-content>
  </div>
</article>
