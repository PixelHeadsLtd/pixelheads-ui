<article 
    id="ph-toastr-item"
    class="animate-normal bg-ph-red-100 box-shadow" 
    [ngClass]="{
        'show-toastr': showToastr,
        'bg-ph-red-100': isError,
        'bg-ph-orange-100': isWarning,
        'bg-ph-green-100': isSuccess,
        'bg-ph-light-blue-100': isInfo
    }"
>
    <button (click)="onCloseClick($event)" class="material-icons ph-white-100">clear</button>
    <div class="flex-group flex-start">
        <section class="flex-align-center">
            <div *ngIf="isError" class="material-icons toastr-icon ph-white-100">local_police</div>
            <div *ngIf="isWarning" class="material-icons toastr-icon ph-white-100">privacy_tip</div>
            <div *ngIf="isSuccess" class="material-icons toastr-icon ph-white-100">verified_user</div>
            <div *ngIf="isInfo" class="material-icons toastr-icon ph-white-100">security</div>
        </section>
        <section>
            <h3 class="margin-0 ph-white-100 margin-bottom-0-25">{{heading}}</h3>
            <p class="ph-white-100 small">{{message}}</p>
        </section>
    </div>
</article>
