<div
  class="aa-popover"
  [ngClass]="{
  'show-popover' : showPopover,
  'btn-small' : btnSmall
  }"
  [ngStyle]="{
    'z-index' : showPopover ? zIndex : ''
  }"
  >
  <div class="aa-popover-header" (click)="changeVisibility()" [ngClass]="{'label-hidden' : hideLabel}">
    <ng-content select="[call-to-action]"></ng-content>
    <div
      class="arrow"
      [ngStyle]="popoverTop ? {
        'top' : arrowPos,
        'bottom' : 'unset',
        'transform' : 'rotate(180deg)'
      } : {}"
    ></div>
  </div>
  <div
    class="aa-popover-content feature-box"
    [ngStyle]="{
    'top': topPos,
    'right': rightPos, 
    'bottom': bottomPos,
    'left': leftPos, 
    'width': width
  }">
    <ng-content select="[custom-content]"></ng-content>
  </div>
</div>
