<article 
  *ngIf="!cardOptional && !cardMini && !cardDetailed" 
  class="aa-card flex-group width-control box-shadow" 
  [ngStyle]="{
    'z-index' : zIndex,
    'top' : topPos,
    'left' : leftPos,
    'right' : rightPos
  }"
>
  <div class="card-image fingerprint border-light">
    <img onerror="this.style.display='none'" alt="{{cardName}}" [src]="imgPath">
  </div>
  <div>
    <h3 title="{{cardName}}">{{cardName}}</h3>
    <p title="{{cardRole}}">{{cardRole}}</p>
    <div class="aa-toolbar">
      <ng-content select="[card-menu]"></ng-content>
    </div>
  </div>
</article>

<article 
  *ngIf="cardOptional" 
  class="aa-card-opt box-shadow" 
  [ngStyle]="{'z-index' : zIndex}"
>
    <div class="flex-group flex-end flex-align-center">
      <ng-content select="[card-menu-opt]"></ng-content>
    </div>
    <div class="cursor-pointer" (click)="onCardClick($event)">
      <div class="card-image fingerprint" [ngStyle]="{'border' : '.35rem solid ' +themeColour, 'background-color' : themeColour}">
        <img onerror="this.style.display='none'" alt="{{cardName}}" [src]="imgPath">
      </div>
      <h3 title="{{cardName}}" [ngStyle]="{'color' : themeColour }">{{ (cardName.length>14)? (cardName | slice:0:14)+'...':(cardName) }}</h3>
      <p title="{{cardRole}}">{{ (cardRole.length>37)? (cardRole | slice:0:37)+'...':(cardRole) }}</p>
    </div>
    <ng-content select="[card-hover-content]"></ng-content>
</article>

<button 
  *ngIf="cardMini" 
  class="card-mini flex-align-center flex-start {{borderClass}} box-shadow"
  (click)="onCardClick($event)"
>
  <div *ngIf="showAsIcon" class="material-icons">{{iconName}}</div>
  <div *ngIf="showAsProfile" class="card-image fingerprint">
    <ng-content select="[profile-image]"></ng-content>
  </div>
  <div>
    <h5>{{title}}</h5>
    <ng-content select="[content]"></ng-content>
  </div>
</button>

<article 
  *ngIf="cardDetailed" 
  class="aa-card card-detailed flex-group flex-nowrap box-shadow" 
  [ngStyle]="{
    'z-index' : zIndex,
    'top' : topPos,
    'left' : leftPos,
    'width' : cardWidth
  }"
>
  <div class="card-image fingerprint border-light">
    <img alt="{{cardName}}" [src]="imgPath">
  </div>
  <div>
    <ng-content select="[card-detailed-content]"></ng-content>
  </div>
</article>
