<section class="aa-multi-select">
  <header (click)="toggleDropdown($event)" class="aa-multi-select-header flex-group space-between flex-align-center bg-aa-white-100">
    <span>{{ selectedItems.length > 0 ? selectedItems.length + ' selected' : 'Select items' }}</span>
  </header>

  <div *ngIf="isDropdownOpen" class="aa-multi-select-popup border-radius-0-25 bg-aa-white-100 box-shadow">
    <section class="aa-multi-select-filter flex-align-center bg-aa-light-blue-10">
      <label class="padding-0">
        <input type="checkbox" [checked]="isAllSelected" (change)="toggleSelectAll()" />
      </label>
      <div class="position-relative width-100">
        <input class="padding-right-1-75" [(ngModel)]="searchTerm" placeholder="Search" type="text" />
        <div 
          class="material-icons xxsmall aa-light-blue-100 cursor-pointer position-absolute"
          (click)="clearSearch()"
        >close</div>
      </div>
    </section>

    <section 
      [ngStyle]="{'max-height': maxHeight}"
      class="aa-multi-select-content flex-group flex-start flex-column flex-nowrap overflow-y-scroll"
    >
      <div *ngFor="let item of filteredItems; trackBy: trackByItem">
        <div class="flex-group flex-start flex-align-center">
          <label class="padding-0">
            <input type="checkbox" [checked]="isItemSelected(item)" (change)="toggleItemSelection(item)" />
          </label>
          <span>{{ item[labelKey] }}</span>
        </div>
      
        <div *ngIf="getChildren(item).length > 0">
          <div *ngFor="let child of getChildren(item); trackBy: trackByItem" class="flex-group flex-start flex-align-center" style="margin-left: 20px;">
            <label class="padding-0">
              <input type="checkbox" [checked]="isItemSelected(child)" (change)="toggleItemSelection(child)" />
            </label>
            <span>{{ child[labelKey] }}</span>
          </div>
        </div>
      </div>
    </section>
  </div>
</section>
