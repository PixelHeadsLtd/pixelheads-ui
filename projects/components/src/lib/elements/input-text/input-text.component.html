<div id="ph-input-text" class="field {{fieldClass}}">
  <label for="{{inputTextId}}">
    {{inputTextLabel}}
    <span class="optional" *ngIf="isOptional">Optional</span>
  </label>
  <input 
    type="text" 
    name="{{inputTextId}}" 
    id="{{inputTextId}}" 
    placeholder="{{inputPlaceholder}}" 
    readonly="{{readOnly}}"
    value="{{inputValue}}"
    >
</div>
