
  <div id="ph-checkbox" class="field checkbox {{fieldClass}}">
      <label for="{{checkboxId}}">
          <input 
            type="checkbox" 
            value={{checkboxValue}} 
            name={{checkboxName}} 
            id={{checkboxId}} 
            checked={{checkboxChecked}}
            disabled="{{disabled}}"
          >
          <span>{{checkboxText}}</span>
      </label>
  </div>
