<div 
    class="{{fieldClass}} field slider"
    [ngClass]="{'slider-inline flex-group flex-start nowrap' : sliderInline}"
>
    <label>{{labelText}}</label>
    <label>
        <input 
            type="checkbox"
            [name]="sliderName"
            [id]="sliderId"
            [checked]="sliderCheckedValue"
            [disabled]="disabled"
            (change)="onChange($event)"
         />
        <span class="slider-btn"></span>
    </label>
</div>
