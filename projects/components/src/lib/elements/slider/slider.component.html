<div 
    class="{{fieldClass}} field slider"
    [ngClass]="{
        'slider-inline flex-group flex-start flex-align-center nowrap' : sliderInline,
        'list-display' : labelMinWidth
    }"
>
    <label [ngStyle]="{ 'min-width': labelMinWidth }">{{labelText}}</label>
    <label>
        <input 
            type="checkbox"
            [name]="sliderName"
            [id]="sliderId"
            [checked]="sliderCheckedValue"
            [disabled]="disabled"
            (change)="onChange($event)"
         />
        <span class="slider-btn"></span>
    </label>
</div>
