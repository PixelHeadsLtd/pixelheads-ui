<div id="ph-file-upload" class="field {{fieldClass}}">
  <label for="{{fileUploadId}}">{{fileUploadLabel}}</label>
  <div class="flex-group flex-start flex-align-center">
    <div class="file-upload">
      <input 
        name="file-upload" 
        type="file" 
        id="{{fileUploadId}}" 
        accept="{{fileUploadExtentions}}" 
        value="{{fileUploadValue}}"
        title="{{fileUploadName}}"
      >
      <div 
        *ngIf="!customButton" 
        class="file-upload-graphic"
      >
        <div>{{fileUploadText}}</div>
      </div>
      <div 
        *ngIf="customButton" 
        class="custom-file-upload-graphic {{bgColor}}"
      >
        <div class="flex-group flex-start flex-align-center">
          <div class="material-icons margin-right-0-25 {{textColor}}">{{iconName}}</div>
          <div class="{{textColor}}">{{fileUploadText}}</div>
        </div>
      </div>
    </div>
    <div 
      *ngIf="fileUploadName" 
      title="{{ fileUploadName }}"
      class="file-upload-name italic"
      [ngClass]="{'ellipsis' : truncateFileName}"
      [ngStyle]="{'max-width' : truncateWidth}"
      >
      {{ fileUploadName }}
    </div>
  </div>
</div>
