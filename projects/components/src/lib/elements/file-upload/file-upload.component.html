<div class="field {{fieldClass}}">
  <label for="{{fileUploadId}}">{{fileUploadLabel}}</label>
  <div class="flex-group flex-start flex-align-center">
    <div class="file-upload">
      <input 
        name="file-upload" 
        type="file" 
        id="{{fileUploadId}}" 
        accept="{{fileUploadExtentions}}" 
        value="{{fileUploadValue}}"
        title="{{fileUploadName}}"
      >
      <div class="file-upload-graphic">
        <div>{{fileUploadText}}</div>
      </div>
    </div>
    <div 
      *ngIf="fileUploadName" 
      title="{{ fileUploadName }}"
      class="file-upload-name italic"
      [ngClass]="{'ellipsis' : truncateFileName}"
      [ngStyle]="{'max-width' : truncateWidth+'rem'}"
      >
      {{ fileUploadName }}
    </div>
  </div>
</div>
