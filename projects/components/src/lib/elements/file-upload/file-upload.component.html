<div class="field {{fieldClass}}">
  <label for="{{fileUploadId}}">{{fileUploadLabel}}</label>
  <div class="flex-group flex-start">
    <div class="file-upload">
      <input name="file-upload" type="file" id="{{fileUploadId}}" accept="{{fileUploadExtentions}}" value="{{fileUploadValue}}">
      <div class="file-upload-graphic">
        <div>{{fileUploadText}}</div>
      </div>
    </div>
    <div class="file-upload-name margin-top-0-5">{{ fileUploadName }}</div>
  </div>
</div>
