<div 
  *ngIf="!buttonEnriched && !buttonSplit &&!buttonSummary" 
  class="field {{fieldClass}}"
  [class.button-large]="buttonLarge"
>
  <label 
    [ngClass]="{ 'show-label': showLabel }"
    [for]="buttonId">
    {{buttonLabel}}
  </label>
  <button 
    [type]="buttonType" 
    [name]="buttonId" 
    [id]="buttonId" 
    [class]="buttonClass" 
    [disabled]="disabled" 
    (click)="onButtonClick($event)"
    [ngClass]="{'material-icons' : customIconsRound}"
  >
    <div *ngIf="!customIconsRound" [ngClass]="{'flex-group flex-start' : customIcons}">
      <span *ngIf="customIcons" class="material-icons">{{buttonIcon}}</span>
      <span>{{buttonText}}</span>
      <div *ngIf="showCount" class="count {{countColor}}">{{count}}</div>
    </div>
    <span *ngIf="customIconsRound">{{buttonIcon}}</span>
  </button>
</div>

<div *ngIf="buttonEnriched" class="field {{fieldClass}}">
  <button 
    [type]="buttonType" 
    [name]="buttonId" 
    [id]="buttonId" 
    [disabled]="disabled" 
    (click)="onButtonClick($event)"
    class="btn-enriched box-shadow gradient-v-grey"
  >
    <div class="flex-group flex-end btn-enriched-toolbar">
      <ng-content select="[toolbar]"></ng-content>
    </div>
    <div class="btn-enriched-content flex-group flex-start flex-align-center">
      <div class="material-icons {{iconColour}}">{{iconName}}</div>
      <h2 class="margin-0">{{title}}</h2>
    </div>
  </button>
</div>

<div *ngIf="buttonSplit" class="field {{fieldClass}}">
  <label [for]="buttonId">{{buttonLabel}}</label>
  <div class="button-split">
    <button
      (click)="showBtnMenu=!showBtnMenu" 
      [class]="buttonClass"
      [type]="buttonType" 
      [name]="buttonId" 
      [id]="buttonId"
     >
      {{buttonText}}
    </button>
    <nav 
      (click)="showBtnMenu=false" 
      *ngIf="showBtnMenu" 
      class="box-shadow-strong"
      [ngStyle]="{'max-height' : maxHeight}"
    >
      <ng-content select="[bs-buttons]"></ng-content>
    </nav>
  </div>
</div>

<div *ngIf="buttonSummary" class="field {{fieldClass}} flex-stretch">
  <button
    class="{{status}} button-summary border-radius-0-5 box-shadow bg-aa-white-100 padding-1-5 flex-column bd-aa-grey-5"
  >
    <div class="flex-group flex-start flex-align-center">
      <h1 class="priority bg-aa-white-100 border-radius-50 width-3 height-3 flex-center bd-solid">{{level}}</h1>
      <h2 class="margin-0">{{title}}</h2>
    </div>
    <p *ngIf="showDescription" class="margin-top-1">
      {{desc}}
    </p>
  </button>
</div>
