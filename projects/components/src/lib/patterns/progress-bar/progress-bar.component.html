<div class="progress-bar" [ngStyle]="{'width' : maxWidth+'rem'}">
    <span>
        <strong>{{titleBold}} </strong>
        <span>{{titleRegular}}</span>
    </span>
    <div class="progress"><div [ngStyle]="{'width' : complete+'%'}"></div></div>
    <div class="flex-group space-between">
        <div>{{leftSideText}}</div>
        <div>{{rightSideText}}</div>
    </div>
</div>
