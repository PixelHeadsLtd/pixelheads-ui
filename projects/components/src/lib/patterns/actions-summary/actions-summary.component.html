<article 
    class="actions-summary flex-group flex-start"
    [ngClass]="{ 
        'flex-column' : verticalDisplay,
        'flex-nowrap' : noWrap
    }"
>
    <section 
        *ngFor="let item of actionsSummaryItems; let i = index" 
        class="
            flex-center 
            flex-group 
            flex-column
        "
    >
        <strong class="nowrap margin-0">{{item.title}}</strong>
        <h4 class="
            {{item.status}} 
            flex-center 
            bd-2 
            bd-solid 
            border-radius-50 
            width-2 
            height-2 
            margin-top-0-75
            margin-right-0"
            >
            {{item.value}}
        </h4>
    </section>
</article>
