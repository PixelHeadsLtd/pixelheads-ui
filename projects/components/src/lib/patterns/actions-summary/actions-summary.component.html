<section 
    [ngClass]="{'bd-right-2 bd-right-blue-15 bd-right-solid' : divider}"
    class="
        flex-center 
        flex-group 
        flex-column 
        margin-0
        margin-bottom-0-75 
        padding-x-1
    "
>
    <strong class="nowrap aa-blue-100 margin-0">{{title}}</strong>
    <h4 class="
        {{status}} 
        flex-center 
        bd-2 
        bd-solid 
        border-radius-50 
        width-2 
        height-2 
        margin-top-0-75
        margin-right-0"
        >
        {{value}}
    </h4>
</section>
