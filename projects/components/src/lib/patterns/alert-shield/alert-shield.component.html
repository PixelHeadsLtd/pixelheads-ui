<div 
    id="ph-alert-shield"
    *ngIf="!customShield && !numericalShield" 
    class="alert-shield {{alertShieldStatus}}" 
    [ngClass]="{
        'small' : alertShieldSmall, 
        'nowrap' : noWrap 
        }"
    >
    <span [ngStyle]="{ 'display': hideLabel ? 'none' : 'inline' }">
        {{alertShieldText}}
    </span>
</div>

<div 
    id="ph-custom-alert-shield"
    *ngIf="customShield && !numericalShield" 
    class="custom-alert-shield"
>
    <div 
        class="
            flex-group 
            flex-align-center 
            flex-start 
            custom-alert-shield-container
            {{shieldColour}}
        "
        [ngClass]="{
            'small' : alertShieldSmall,
            'nowrap' : noWrap,
            'icon-only' : iconOnly,
            'rotate' : enableRotation
        }"
      >
        <div 
            [ngClass]="{
                'material-icons' : !iconOutlined,
                'material-icons-outlined' : iconOutlined
            }">
            {{iconName}}
        </div>
        <span [ngStyle]="{ 'display': hideLabel ? 'none' : 'inline' }">
            {{alertShieldText}}
        </span>
    </div>
</div>

<div 
    id="ph-numerical-alert-shield"
    *ngIf="numericalShield && !customShield" 
    class="alert-shield numerical-alert-shield {{alertShieldStatus}}" 
    [ngClass]="{ 'small' : alertShieldSmall }"
    >
    <div class="flex-group flex-start flex-align-center flex-nowrap">
        <div class="alert-shield-value flex-center border-radius-1">{{numericalValue}}</div>
        <div>
            {{alertShieldText}}
        </div>
    </div>
</div>
