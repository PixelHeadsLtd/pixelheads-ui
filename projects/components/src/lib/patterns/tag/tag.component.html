<section 
    id="ph-tag"
    *ngIf="!isShaped" 
    class="ph-tag"
    [ngClass]="{
        'bg-ph-red-100' : isRed,
        'bg-ph-orange-100' : isOrange,
        'bg-ph-green-100' : isGreen,
        'bg-ph-blue-100' : isBlue,
        'bg-ph-light-blue-100' : isLightBlue,
        'bg-ph-plum-100' : isPlum,
        'bg-ph-ochre-100' : isOchre,
        'bg-ph-white-100' : isWhite,
        'bg-ph-grey-100' : isBlack,
        'bg-ph-pink-100' : isPink
    }"
>
    <div *ngIf="!isWhite" class="material-icons ph-white-100">loyalty</div>
    <div *ngIf="isWhite" class="material-icons ph-blue-100">loyalty</div>
    <span *ngIf="!isWhite" class="ph-white-100">{{tagText}}</span>
    <span *ngIf="isWhite" class="ph-blue-100">{{tagText}}</span>
    <a *ngIf="!isWhite" class="anchor-close ph-white-100" (click)="onRemove($event)"></a>
    <a *ngIf="isWhite" class="anchor-close ph-blue-100" (click)="onRemove($event)"></a>
</section>

<section 
    id="ph-tag-shaped"
    *ngIf="isShaped"
    class="ph-tag-shaped"
    [ngClass]="{
        'bg-ph-red-100' : isRed,
        'bg-ph-orange-100' : isOrange,
        'bg-ph-green-100' : isGreen,
        'bg-ph-blue-100' : isBlue,
        'bg-ph-light-blue-100' : isLightBlue,
        'bg-ph-plum-100' : isPlum,
        'bg-ph-ochre-100' : isOchre,
        'bg-ph-white-100' : isWhite,
        'bg-ph-grey-100' : isBlack,
        'bg-ph-pink-100' : isPink
    }"
>
    <span>{{tagText}}</span>
</section>
