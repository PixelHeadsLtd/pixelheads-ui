<section class="control-bar">
    <h1>Tree menu</h1>
</section>

<section class="content-container padding-0">

    <section class="content-repeater flex-group">

        <section class="flex-1 col-left flex-start">
          <h2>Tree menu</h2>
          <div class="describe margin-bottom-1">
            <p>To get the markup, please refer to the gist file on the right</p>
          </div>

          <div class="ph-tree">
            <app-tree [treeData]="nodes"></app-tree>
          </div>

        </section>

        <section class="flex-2 col-right flex-start">
          <table class="half-width">
            <caption>Attributes</caption>
            <thead>
              <tr>
                <th>Element</th>
                <th>Attribute</th>
                <th>Type</th>
                <th>Default</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td datalabel="Element">Div</td>
                <td datalabel="Attribute">Classname</td>
                <td datalabel="Type">Class</td>
                <td datalabel="Default">ph-tree</td>
              </tr>
              <tr>
                <td datalabel="Element">app-tree</td>
                <td datalabel="Attribute">treeData</td>
                <td datalabel="Type">Component</td>
                <td datalabel="Default">nodes</td>
              </tr>
            </tbody>
          </table>
        </section>

        <!-- mini menu -->
        <nav class="mini-menu flex-group flex-end">
            <button class="custom-icons bg-ph-light-blue-100" (click)="bladeIsOpen(true)">
              <span class="material-icons">visibility</span><span>View gist</span>
            </button>
          </nav>
      </section>

      <ph-blade
        [blockPageUI]="false"
        [toggleBlade]="toggleBlade"
        [suppressAutoClose]="false"
        topPosition="3.5rem"
        [zIndex]="2"
        bladeSize="one-column-width"
        bladeHeading="Gist"
        [enableIcon]="true"
        iconName="table_rows"
        (bladeOpen)="bladeIsOpen($event)"
        >
        <article class="blade-content">
          <a href="https://gist.github.com/PixelHeadsLtd/e20ffac078a4e412a006f465b44910ba" target="_blank">View Gist on GitHub</a>
          <app-gist src="PixelHeadsLtd/e20ffac078a4e412a006f465b44910ba"></app-gist>
        </article>
      </ph-blade>

</section>
