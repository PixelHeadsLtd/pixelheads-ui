<section class="control-bar">
  <h1>Modal</h1>
</section>

<section class="content-container padding-0">
    <!-- start content repeater -->
    <section class="content-repeater flex-group">
      <section class="flex-1 col-left flex-start">
        <h2>Modal</h2>
        <div class="describe margin-bottom-1">
          <p>Modals should only ever be used to display a simple message to your users
            such as a simple confirmation Yes/No
          </p>
        </div>

        <ph-button
          (buttonClick)="openModal()"
          buttonClass="primary"
          fieldClass="boxed label-hidden"
          buttonId="BtnId"
          buttonLabel="Modal"
          buttonText="Show modal">
        </ph-button>

      </section>

      <section class="flex-2 col-right flex-start">
        <table class="half-width">
          <caption>Attributes</caption>
          <thead>
            <tr>
              <th>Element</th>
              <th>Attribute</th>
              <th>Type</th>
              <th>Default</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td datalabel="Element">Button</td>
              <td datalabel="Attribute">buttonClick</td>
              <td datalabel="Type">Function</td>
              <td datalabel="Default">openModal()</td>
            </tr>
            <tr>
              <td datalabel="Element">Div</td>
              <td datalabel="Attribute">Id</td>
              <td datalabel="Type">Id</td>
              <td datalabel="Default">#modal</td>
            </tr>
          </tbody>
        </table>
      </section>

      <!-- mini menu -->
      <nav class="mini-menu flex-group flex-end">
          <button class="custom-icons bg-ph-light-blue-100" (click)="bladeIsOpen(true)">
            <span class="material-icons">visibility</span><span>View gist</span>
          </button>
        </nav>
    </section>
</section>

<ph-blade
    [blockPageUI]="false"
    [toggleBlade]="toggleBlade"
    [suppressAutoClose]="false"
    topPosition="3.5rem"
    [zIndex]="2"
    bladeSize="one-column-width"
    bladeHeading="Gist"
    [enableIcon]="true"
    iconName="table_rows"
    (bladeOpen)="bladeIsOpen($event)"
  >
  <article class="blade-content">
    <a href="https://gist.github.com/PixelHeadsLtd/09afb4be3d3a6217d2521cab0d85b1da" target="_blank">View Gist on GitHub</a>
    <app-gist src="PixelHeadsLtd/09afb4be3d3a6217d2521cab0d85b1da"></app-gist>
  </article>
</ph-blade>
