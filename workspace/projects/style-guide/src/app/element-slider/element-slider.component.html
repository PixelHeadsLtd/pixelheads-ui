<section class="control-bar">
    <h1>Element slider</h1>
</section>

<section class="content-container padding-0">
    <!-- start content repeater -->
    <section class="content-repeater flex-group">
        <section class="flex-1 col-left flex-start">
          <h2>Element slider</h2>
          <div class="describe margin-bottom-1">
            <p>
                A handy widget to display single-row form elements 
                which can be tucked away to help unclutter the page
            </p>
          </div>
        </section>

        <section class="flex-2 col-right flex-start">
          <table class="half-width">
            <caption>Attributes</caption>
            <thead>
              <tr>
                <th>Element</th>
                <th>Attribute</th>
                <th>Type</th>
                <th>Default</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td datalabel="Element">aa-element-slider</td>
                <td datalabel="Attribute">aa-element-slider</td>
                <td datalabel="Type">Component</td>
                <td datalabel="Default">N/A</td>
              </tr>
            </tbody>
          </table>
        </section>

        <aa-element-slider class="margin-top-1">
            <form class="flex-group">
                <div class="field boxed">
                    <label>Choose status</label>
                    <select>
                        <option>Please select</option>
                        <option>Approved</option>
                        <option>Awaiting approval</option>
                        <option>Rejected</option>
                    </select>
                </div>
                <div class="field boxed">
                    <label>Choose status</label>
                    <input type="text" placeholder="Name"/>
                </div>
            </form>
        </aa-element-slider>

        <!-- mini menu -->
        <nav class="mini-menu flex-group flex-end">
          <button class="custom-icons bg-aa-light-blue-100" (click)="bladeIsOpen(true)">
            <span class="material-icons">visibility</span><span>View gist</span>
          </button>
        </nav>
      </section>

      <aa-blade
        [blockPageUI]="false"
        [toggleBlade]="toggleBlade"
        [suppressAutoClose]="false"
        topPosition="3.5rem"
        [zIndex]="2"
        bladeSize="one-column-width"
        bladeHeading="Gist"
        [enableIcon]="true"
        iconName="table_rows"
        (bladeOpen)="bladeIsOpen($event)"
        >
        <article class="blade-content">
          <a href="https://gist.github.com/angloux/98f547986e54f7d0439615740a480860" target="_blank">View Gist on GitHub</a>
          <app-gist src="angloux/98f547986e54f7d0439615740a480860"></app-gist>
        </article>
      </aa-blade>

</section>
