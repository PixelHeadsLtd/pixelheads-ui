<span 
    id="aa-counter"
    class="
    flex-group 
    flex-center 
    border-radius-50
    width-1-25
    height-1-25
    font-size-xsmall"
    
    [ngClass]="{
        'bg-aa-light-blue-100' : countInfo,
        'bg-aa-red-100' : countError, 
        'bg-aa-orange-100' : countWarning,
        'bg-aa-green-100' : countSuccess,
        'bg-aa-light-blue-15' : countInfoLight,
        'bg-aa-red-10' : countErrorLight, 
        'bg-aa-orange-10' : countWarningLight,
        'bg-aa-green-15' : countSuccessLight
    }"
    >
    <strong 
        class="flex-group flex-center"
        [ngClass]="{
            'aa-white-100' : 
            countInfo || 
            countError || 
            countWarning || 
            countSuccess
        }"
        >
        {{ count }}
    </strong>
</span>
