<section 
    class="blade-top gradient-h-blue width-control flex-group"
    [ngClass]="{'show-top-blade box-shadow-light' : isOpen}"
    [ngStyle]="{
        'left' : leftPos, 
        'right' : rightPos,
        'margin-top' : topPos,
        'z-index' : zIndex,
        'max-height' : maxHeight
    }">
    <div class="flex-group flex-start">
        <div *ngIf="userProfile" class="position-relative margin-top-1-5">
            <div class="flag {{countryFlag}}"></div>
            <div class="user-profile fingerprint" 
                [ngStyle]="{
                    'border' : borderThickness+' solid '+borderColour, 
                    'border-style' : 'solid', 
                    'width' : profileSize, 
                    'height' : profileSize
                }">
                <ng-content select="[user-profile]"></ng-content>
            </div>
        </div>
        <ng-content select="[custom-content]"></ng-content>
    </div>
    <div class="blade-top-controls flex-group">
        <button (click)="toggleThePin($event)" class="material-icons pin flex-end margin-right-0-5" [ngStyle]="{'transform': isPinned ? 'rotate(0deg)' : 'rotate(90deg)'}">push_pin</button>
        <button (click)="onClose()" class="material-icons">close</button>
    </div>
</section>
