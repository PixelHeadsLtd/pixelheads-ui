<section [id]="accordionId">
  <h3 class="margin-0">
    <button class="accordion-fancy-trigger box flex-group flex-align-center space-between" (click)="showBody=!showBody"
        [attr.aria-expanded.true]="showBody" aria-controls="accordionId" type="button">
        <div class="flex-align-center">
          <div *ngIf="materialIcons" class="material-icons {{iconColour}}">{{iconName}}</div>
          <div *ngIf="!materialIcons" class="font-awesome-icons {{iconName}} {{iconColour}}"></div>
          <span>{{itemTitle}}</span>
        </div>
        <div class="aa-toggle flex-align-center">
          <div *ngIf="!showBody" class="material-icons">add</div>
          <div *ngIf="showBody" class="material-icons">remove</div>
        </div>
    </button>
  </h3>
  <div *ngIf="showBody" class="accordion-fancy-panel">
    <ng-content></ng-content>
  </div>
</section>
