<div class="aa-comments">
  <button 
    class="custom-icons cursor-pointer {{buttonClass}}"
    (click)="makeComments = ! makeComments; toggleComments=false; clicked=false"
  >
    <div class="flex-center">
      <span class="material-icons {{iconColour}}">chat</span>
      <span *ngIf="comments.length===0">Click to add a comment</span>
      <span *ngIf="comments.length===1">There is ({{comments.length}}) comment</span>
      <span *ngIf="comments.length>1">There are ({{comments.length}}) comments</span>
    </div>
  </button>
  <div
    class="
    comments-panel
    margin-top-0-75
    box-shadow
    border-radius-0-25
    bg-aa-white-100
    padding-1"
    [class.show-comments]="makeComments"
  >
    <p
      class="margin-top-0 italic aa-blue-100"
      *ngIf="!comments.length && !makeComments"
    >There are currently no comments
    </p>
    <div *ngIf="makeComments" class="field boxed">
      <label>Comment</label>
      <textarea [(ngModel)]="txtComment" placeholder="Your Comment" (change)="clicked=false"></textarea>
      <div class="flex-group flex-start">
        <button class="secondary margin-top-1" (click)="addComment($event, cmt)">Add comment</button>
        <button
          class="cancel margin-top-1"
          (click)="makeComments=false; toggleComments=false"
          >Close
        </button>
        <div>
          <div
            *ngIf="clicked && !txtComment"
            role="alert"
            class="error margin-top-1"
            >You need to add a comment
          </div>
        </div>
      </div>
    </div>

    <div class="field boxed" *ngIf="comments.length">
      <h3 *ngIf="makeComments">Comments ({{comments.length}})</h3>
      <div *ngIf="!toggleComments" class="scroll-panel">
          <div class="scroll-panel-content" [ngStyle]="{'max-height':'8rem'}">
            <table class="table-comments">
              <thead>
                <tr>
                  <th width="62%"><div><span>Comment</span></div></th>
                  <th width="20%"><div><span>Added by</span></div></th>
                  <th width="16%"><div><span>Date added</span></div></th>
                  <th width="2" *ngIf="canDelete"><div><span>&nbsp;</span></div></th>
                </tr>
              </thead>
              <tbody>
                  <tr *ngFor="let cmt of comments; let i = index">
                      <td title="{{ cmt.comment }}">{{ cmt.comment }}</td>
                      <td title="{{ person }}">{{ person }}</td>
                      <td title="{{ currentDate | DateFormatPipe }}">{{ currentDate | DateFormatPipe }}</td>
                      <td *ngIf="canDelete">
                        <button
                          class="material-icons aa-red-100 transparent"
                          (click)="removeComment(i)"
                          >delete_forever</button>
                      </td>
                  </tr>
              </tbody>
            </table>
          </div>
        </div>
    </div>
  </div>
</div>
