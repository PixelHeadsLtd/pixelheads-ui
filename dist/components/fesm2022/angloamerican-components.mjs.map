<div 
    *ngIf="!showTooltip && !customShield" 
    class="alert-shield {{alertShieldStatus}}" 
    [ngClass]="{
        'small' : alertShieldSmall, 
        'nowrap' : noWrap 
        }"
    >
    <span [ngStyle]="{ 'display': hideLabel ? 'none' : 'inline' }">
        {{alertShieldText}}
    </span>
</div>

<div 
    *ngIf="showTooltip && !customShield" 
    class="alert-shield-tooltip-wrapper"
    [ngClass]="{
        'tooltip-top-left' : tooltipTopLeft,
        'tooltip-top-right' : tooltipTopRight,
        'tooltip-bottom-left' : tooltipBottomLeft,
        'tooltip-bottom-right' : tooltipBottomRight
    }"
>
    <div 
        class="alert-shield-tooltip {{alertShieldStatus}}"
        [ngStyle]="{'min-width' : minWidth}"
    >
        <h4 *ngIf="showTooltipHeading">{{tooltipHeading}}</h4>
        <ng-content select="[tooltip-content]"></ng-content>
    </div>
    <div 
        class="alert-shield {{alertShieldStatus}}" 
        [ngClass]="{
            'small' : alertShieldSmall, 
            'nowrap' : noWrap 
            }"
        >
            <span [ngStyle]="{ 'display': hideLabel ? 'none' : 'inline' }">
                {{alertShieldText}}
            </span>
    </div>
</div>

<div 
    *ngIf="customShield" 
    class="custom-alert-shield"
    [ngClass]="{
        'tooltip-top-left' : tooltipTopLeft,
        'tooltip-top-right' : tooltipTopRight,
        'tooltip-bottom-left' : tooltipBottomLeft,
        'tooltip-bottom-right' : tooltipBottomRight
    }"
>
    <div 
        class="
            flex-group 
            flex-align-center 
            flex-start 
            custom-alert-shield-container
            {{shieldColour}}
        "
        [ngClass]="{
            'small' : alertShieldSmall,
            'nowrap' : noWrap,
            'icon-only' : iconOnly,
            'rotate' : enableRotation
        }"
      >
        <div 
            *ngIf="showTooltip"
            class="alert-shield-tooltip"
            [ngStyle]="{'min-width' : minWidth}"
        >
            <h4 *ngIf="showTooltipHeading">{{tooltipHeading}}</h4>
            <ng-content select="[custom-tooltip-content]"></ng-content>
        </div>
        <div 
            [ngClass]="{
                'material-icons' : !iconOutlined,
                'material-icons-outlined' : iconOutlined
            }">
            {{iconName}}
        </div>
        <span [ngStyle]="{ 'display': hideLabel ? 'none' : 'inline' }">
            {{alertShieldText}}
        </span>
    </div>
</div>
