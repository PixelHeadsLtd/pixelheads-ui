<div class="flex-group width-control repeatable">
  <button (click)="onFavClick($event)" class="button-star icon-orange one-rem" [class.selected]="isFavourite"></button>
  <div><a (click)="onAnchorClick($event)" title="{{itemAnchorTitle}}" type="button">{{itemAnchor}}</a></div>
  <div>{{itemDescription}}</div>
</div>
