<div
  class="aa-custom-select"
  [ngStyle]="{'width' : setWidth}"
>
  <button
    class="
    border-radius-0-25
    flex-align-center"
    (click)="showDropdown=!showDropdown"
  >
    <span
      class="
      material-icons
      padding-right-0-5
      {{ selectedOption?.iconColor }}"
    >{{ selectedOption?.icon }}
    </span>

    <span>{{ selectedOption?.display }}</span>

  </button>

  <!-- dropdown -->
  <div
    [class.show-dropdown]="showDropdown"
    class="aa-custom-select-dropdown box-shadow"
    [ngStyle]="{'max-height' : maxHeight}"
  >
    <div *ngFor=" let option of options; let i = index">
      <button
        (click)="optionIsSelected($event, option); setIndex(i)"
        class="flex-align-center"
        [class.selected]="sIndex === i"
      >
        <span
          *ngIf="option.showIcon"
          class="
          material-icons
          padding-right-0-5
          {{option.iconColor}}"
        >{{ option.icon }}</span>
          {{ option.display }}
      </button>
    </div>
  </div>
</div>
