<div class="accordion-favourites-list">
  <div class="flex-group flex-start flex-align-center">
    <button 
      *ngIf="!isFavourite" 
      (click)="onFavClick($event)" 
      class="btn-fav material-icons-outlined margin-left-0-75 margin-right-1-25"
      >
      star_outline
    </button>
    <button 
      *ngIf="isFavourite" 
      (click)="onFavClick($event)" 
      class="btn-fav material-icons-outlined margin-left-0-75 margin-right-1-25"
      >
      star
    </button>

    <div class="margin-top-1 margin-bottom-0-75 description">
      <a (click)="onAnchorClick($event)" class="anchor-underline" title="{{itemAnchorTitle}}"
         type="button" [attr.href]="itemAnchorURL">{{itemAnchor}}</a><br/>
      <div class="margin-top-0-25">{{itemDescription}}</div>
    </div>
  </div>
  <div (click)="showTags=!showTags" class="icon-info"></div>
  <div *ngIf="showTags">
    <div class="more-info">
      <div class="field boxed">
        <label>Tags</label>
        <p>{{tagName}}</p>
      </div>
      <div class="field">
        <label>Last viewed</label>
        <p>{{lastViewed}}</p>
      </div>
      <div class="field">
        <label>Title</label>
        <p>{{favouritesTitle}}</p>
      </div>
      <div class="field">
        <label>Description</label>
        <p>{{favDescription}}</p>
      </div>
    </div>
  </div>
</div>
