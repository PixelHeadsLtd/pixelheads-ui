<div class="position-relative">
    <div [ngClass]="{'tour-active' : tourMode}" [ngStyle]="tourMode ? {'position' : 'relative', 'z-index' : zIndex+1} : {}">
        <ng-content select="[nested-component]"></ng-content>
    </div>
    <div *ngIf="tourMode">
      <div class="tour-mode-info"
          [ngStyle]="{
              'width' : panelWidth,
              'top' : topPos,
              'right' : rightPos,
              'bottom' : bottomPos,
              'left' : leftPos,
              'z-index' : zIndex+1
          }">

          <div *ngIf="arrowTop" class="arrow-top {{arrowClass}}" [ngStyle]="{'left' : arrowPos}"></div>
          <div *ngIf="arrowRight" class="arrow-right {{arrowClass}}" [ngStyle]="{'top' : arrowPos}"></div>
          <div *ngIf="arrowBottom" class="arrow-bottom {{arrowClass}}" [ngStyle]="{'left' : arrowPos}"></div>
          <div *ngIf="arrowLeft" class="arrow-left {{arrowClass}}" [ngStyle]="{'top' : arrowPos}"></div>

          <div class="tour-content">
            <h3 *ngIf="enableHeading">{{tourModeHeading}}</h3>
            <p>
              {{tourModeBody}}
            </p>
          </div>
          <div class="tour-navigation flex-group flex-column">
            <ng-content select="[tour-navigation]"></ng-content>
          </div>
        </div>
      <div class="tour-mode-overlay" [ngStyle]="{'z-index':zIndex}"></div>
    </div>
</div>
