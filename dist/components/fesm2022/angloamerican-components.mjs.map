<div 
    *ngIf="!defaultExpanded"
    role="alert" 
    class="overflow-hidden {{alertClass}}"
    [ngClass]="{
        'align-icon-top' : alignIconTop,
        'max-height-initial' : expandPanel
    }"
    [ngStyle]="{
        'min-width' : minWidth,
        'max-width' : maxWidth,
        'max-height': [collapsedHeight]
    }"
>
    <div 
        *ngIf="collapsible" 
        class="
        flex-group 
        space-between 
        flex-align-center 
        margin-top-0-5"
    >
        <h3 class="margin-0">{{ alertTitle }}</h3>
        <div 
            class="flex-align-center cursor-pointer"
            (click)="expandPanel=!expandPanel"
        >
            <span class="material-icons padding-left-1" *ngIf="!expandPanel">open_in_full</span>
            <span class="material-icons padding-left-1" *ngIf="expandPanel">close_fullscreen</span>
        </div>
    </div>
    <div *ngIf="!collapsible">
        {{ alertText }}
    </div> 
    <div 
        *ngIf="collapsible"
        [ngClass]="{
            'margin-top-1' : collapsible
        }"
    >
        {{ alertText }}
    </div>
</div>
